# A list is only as good as its links. This runs on every change and once a
# week, so rot shows up as a red build rather than a reader's 404.
name: links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200,202,206,403,429
            --exclude-mail
            README.md
          fail: true
